server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Forward API requests to the backend container (docker-compose only;
  # on AWS the load balancer sends /api/* straight to the backend).
  # Resolving at request time keeps nginx from failing to start when
  # the "backend" hostname doesn't exist, e.g. on ECS.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # React app (fallback to index.html)
  location / {
    try_files $uri /index.html;
  }
}
